spring:
  application:
    name: gateway

  r2dbc:
      url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${POSTGRES_DB:gateflow}
      username: ${POSTGRES_USER:gateflow}
      password: ${POSTGRES_PASSWORD:gateflow_local_password}
      
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: management-api
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/**
            
            - id: customer-api
              uri: http://localhost:8081
              predicates:
                - Path=/gateway/**

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info