
spring:
  application:
    name: gateway

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${POSTGRES_DB:gateflow}
    username: ${POSTGRES_USER:gateflow}
    password: ${POSTGRES_PASSWORD:gateflow_local_password}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:10s}

          routes:
            - id: management-api
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/**

            - id: customer-api
              uri: http://localhost:8081
              predicates:
                - Path=/gateway/**

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

  metrics:
    tags:
      application: ${spring.application.name}

gateflow:
  resilience:
    circuit-breaker:
      wait-duration: ${GATEFLOW_CIRCUIT_BREAKER_WAIT_DURATION:30s}
