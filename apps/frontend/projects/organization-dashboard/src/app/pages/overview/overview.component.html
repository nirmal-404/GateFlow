<!-- GateFlow Organization Overview Dashboard Workspace -->
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 space-y-6 sm:space-y-8">
  <!-- 1. Welcome Section & Controls -->
  <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 pb-6 border-b border-slate-200/80">
    <div>
      <div class="flex items-center gap-2">
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900">
          {{ greeting() }}, {{ currentOrg().name }}
        </h1>
        <span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-semibold bg-slate-100 text-slate-700 border border-slate-200">
          {{ currentOrg().plan }}
        </span>
      </div>
      <p class="mt-1 text-xs sm:text-sm text-slate-500">
        Monitor your API gateways, traffic distribution, response latency, and system activity.
      </p>
    </div>

    <!-- Date Range Filter & Refresh Button -->
    <div class="flex items-center gap-2.5 self-start md:self-auto">
      <!-- Date Range Selector Pill Group -->
      <div class="inline-flex p-1 bg-slate-200/60 rounded-lg border border-slate-200 text-xs font-medium text-slate-600">
        @for (range of dateRanges; track range.id) {
          <button
            type="button"
            (click)="setDateRange(range.id)"
            class="px-3 py-1.5 rounded-md transition-all duration-150 cursor-pointer"
            [class.bg-white]="selectedDateRange() === range.id"
            [class.text-slate-900]="selectedDateRange() === range.id"
            [class.font-semibold]="selectedDateRange() === range.id"
            [class.shadow-2xs]="selectedDateRange() === range.id"
            [class.text-slate-600]="selectedDateRange() !== range.id"
            [class.hover:text-slate-900]="selectedDateRange() !== range.id"
          >
            {{ range.label }}
          </button>
        }
      </div>

      <!-- Refresh Button -->
      <button
        type="button"
        (click)="refreshDashboard()"
        [disabled]="isRefreshing()"
        class="inline-flex items-center justify-center p-2 rounded-lg bg-white border border-slate-200 text-slate-600 hover:text-slate-900 hover:bg-slate-50 shadow-2xs focus:outline-none focus:ring-2 focus:ring-blue-500/20 transition-all cursor-pointer disabled:opacity-60"
        matTooltip="Refresh metrics"
        aria-label="Refresh dashboard data"
      >
        <svg
          class="w-4 h-4"
          [class.animate-spin]="isRefreshing()"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
          <path d="M3 3v5h5" />
          <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
          <path d="M16 21h5v-5" />
        </svg>
      </button>
    </div>
  </div>

  <!-- 2. KPI Cards Grid (4 Cards) -->
  <section aria-label="Key Performance Indicators" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6">
    @for (metric of kpiMetrics(); track metric.id) {
      <app-kpi-card [metric]="metric"></app-kpi-card>
    }
  </section>

  <!-- 3. API Traffic Analytics Chart (Large ApexChart) -->
  <section aria-label="Traffic Analytics">
    <app-traffic-chart
      [trafficData]="trafficData()"
      [range]="selectedDateRange()"
    ></app-traffic-chart>
  </section>

  <!-- 4 & 5. Top APIs & Recent Activity (2-Column Grid on Desktop) -->
  <section aria-label="API Operations & Activity" class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <!-- Top APIs Table (2 Columns) -->
    <div class="lg:col-span-2">
      <app-top-apis-table [apis]="topApis()"></app-top-apis-table>
    </div>

    <!-- Recent Activity Feed (1 Column) -->
    <div class="lg:col-span-1">
      <app-recent-activity [activities]="recentActivities()"></app-recent-activity>
    </div>
  </section>
</div>
