<div class="flex h-screen w-screen overflow-hidden bg-slate-50 font-sans">
  <!-- Desktop Permanent Sidebar (w-64 = 16rem = 256px) -->
  <div class="hidden lg:flex lg:flex-shrink-0 lg:w-64 h-full">
    <app-sidebar class="w-full h-full"></app-sidebar>
  </div>

  <!-- Mobile Collapsible Sidebar Drawer with Backdrop -->
  @if (navService.isMobileSidebarOpen()) {
    <div class="fixed inset-0 z-50 lg:hidden flex">
      <!-- Backdrop overlay -->
      <div
        class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs transition-opacity"
        (click)="navService.closeMobileSidebar()"
        aria-hidden="true"
      ></div>

      <!-- Slide-over panel -->
      <div class="relative flex-1 flex flex-col max-w-xs w-full bg-[#0d1527] z-10 shadow-2xl animate-in slide-in-from-left duration-200">
        <app-sidebar class="w-full h-full"></app-sidebar>
      </div>
    </div>
  }

  <!-- Main Content Layout Area -->
  <div class="flex-1 flex flex-col min-w-0 h-full overflow-hidden">
    <!-- Header -->
    <app-header></app-header>

    <!-- Main Workspace Scrollable Container -->
    <main class="flex-1 overflow-y-auto bg-slate-50 focus:outline-none">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
