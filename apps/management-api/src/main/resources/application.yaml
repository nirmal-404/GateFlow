spring:
  application:
    name: management-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${POSTGRES_DB:gateflow}
    username: ${POSTGRES_USER:gateflow}
    password: ${POSTGRES_PASSWORD:gateflow_local_password}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true

server:
  port: 8081

gateflow:
  policy:
    defaults:
      rate-limit: 100
      rate-limit-window-seconds: 60
      quota-limit: 50000
      quota-window: MONTHLY

security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 900000